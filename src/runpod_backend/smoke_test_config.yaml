# Harbor JobConfig for v0 RunPod backend smoke test.
#
# Uses our custom RunpodEnvironment via import_path. Spins one 3090 pod in
# EU-CZ-1 attached to jack-pilot-cz volume, runs claude-code agent for 10 min
# on the GSM8K task, then runs the verifier (PTB's tests/test.sh).
#
# Pre-reqs (set on host before invoking):
#   export RUNPOD_API_KEY=<your-key>
#   export CLAUDE_CODE_OAUTH_TOKEN=<your-oat01-token>   # OR ANTHROPIC_API_KEY
#   export OPENAI_API_KEY=<for-contamination-judge>      # optional for v0
#   export HF_TOKEN=<for-base-model-download>
#
# Run: PYTHONPATH=. harbor run --config src/runpod_backend/smoke_test_config.yaml
job_name: runpod-smoke
n_concurrent_trials: 1
n_attempts: 1

environment:
  import_path: "src.runpod_backend.runpod_environment:RunpodEnvironment"
  # No type field — using import_path instead.
  delete: true
  force_build: false

agents:
  - name: claude-code
    model: anthropic/claude-opus-4-7

tasks:
  - path: harbor_tasks/posttrainbench-gsm8k-qwen3-1.7b

# Cap agent runtime for smoke test (override task.toml's 1h)
agent_timeout_multiplier: 0.17  # 1h * 0.17 = ~10 min
