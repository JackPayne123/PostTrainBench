# Template only - NOT used at runtime.
#
# The real /etc/rclone.conf is baked into the image at build time from the
# RCLONE_CONF GitHub secret (mounted via BuildKit --mount=type=secret in
# Dockerfile.base). This file is kept in-repo only as a structural reference
# so future contributors can see what shape the secret takes.
#
# To regenerate the secret locally:
#   rclone config create drive-personal drive scope=drive
#   rclone config show drive-personal | sed 's/\[drive-personal\]/[drive]/' \
#       > /tmp/rclone.conf
#   echo "root_folder_id = <FOLDER_ID>" >> /tmp/rclone.conf
#   gh secret set RCLONE_CONF -R JackPayne123/PostTrainBench < /tmp/rclone.conf
#
# Expected structure:
#
# [drive]
# type = drive
# scope = drive
# token = {"access_token":"...","refresh_token":"...","token_type":"Bearer","expiry":"..."}
# team_drive =
# root_folder_id = <Drive folder ID where runs upload>
